[project]
name = "paperpulse"
version = "0.1.0"
description = "Spatial metabolomics paper scanner: three-track daily scan + digest + GUI"
requires-python = ">=3.10"
dependencies = ["requests", "pyside6"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
